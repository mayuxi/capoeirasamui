baseURL = 'https://capoeirasamui.com'
languageCode = 'en-us'
title = 'Capoeira Samui'
theme = ["github.com/theNewDynamic/gohugo-theme-ananke/v2"]
resourceDir = "../resources"
DefaultContentLanguage = "en"
SectionPagesMenu = "main"
# featured_image = 'images/capoeirasamui-highres-logo.png'
omit_header_text = true
enableRobotsTXT = true

# This is a "one page"-website, so we do not need these kinds of pages...
disableKinds = ["taxonomy", "term", "RSS"]

[languages]
  [languages.en]
    languageName = "ENG"
    weight = 1
    contentDir = "content/en"
  [languages.th]
    languageName = "ไทย"
    weight = 2
    contentDir = "content/th"
  [languages.ru]
    languageName = "РУC"
    weight = 3
    contentDir = "content/ru"
  [languages.he]
    contentDir = "content/he"
    languageName = "עברית"
    languageDirection = 'rtl'
    weight = 5
  [languages.pt]
    languageName = "POR"
    weight = 4
    contentDir = "content/pt"

[params]
  favicon = "favicon.png"
  site_logo = "images/logo.png"
  images = ['images/capoeirasamui-highres-logo.png'] # used in og:image
  background_color_class = "bg-navy"
  mainSections = ['']
  custom_css = ["custom.css"]

[ananke.social.follow]
new_window_icon = false
networks = [
  "instagram",
  "facebook",
  "whatsapp"
]

[params.ananke.social.instagram]
username = "capoeirasamui"

[params.ananke.social.facebook]
username = "capoeirasamui"

[params.ananke.social.whatsapp]
username = "capoeirasamui"
profilelink = "https://wa.link/cmotjh"